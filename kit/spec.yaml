schemaVersion: "1"
kind: mixin
name: claude-config
displayName: Claude config
description: >-
  Applies Claude Code config (settings.json, status line, CLAUDE.md) inside the
  sandbox. Pairs with the claude-code-custom template, which carries the startup
  scripts under /opt/sbx.

commands:
  initFiles:
    - path: /home/agent/.sbx-workdir
      content: "${WORKDIR}"
  startup:
    - command: ["python3", "/opt/sbx/init-config.py"]
      user: "1000"
    - command: ["/opt/sbx/bin/claude-update"]
      user: "1000"
    # Bind mounts do not survive a sandbox stop; this replays the registered
    # per-repo venv binds on every start.
    - command: ["/opt/sbx/bin/venv-bind", "--restore"]
      user: "1000"

agentContext: |
  uv (the Python package/project manager) and nano are available. Personal
  Claude Code settings and CLAUDE.md are already laid out under ~/.claude at
  startup.

  A repo's .venv cannot live on the workspace mount (it refuses the symlink uv
  creates). Run `venv-bind` once in a repo to give it a ./.venv backed by the
  VM's native filesystem; it is remounted automatically on later starts.
